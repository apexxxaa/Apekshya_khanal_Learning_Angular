<!-- modify-student.component.html -->
<form [formGroup]="carForm" (ngSubmit)="onsubmit">
  <!-- ID Field -->
  <div class="form-group">
    <label for="id">ID</label>
    <input type="number" id="id" formControlName="id" />
  </div>

  <!-- First Name Field -->
  <div class="form-group">
    <label for="make">Make</label>
    <input type="text" id="make" formControlName="make" />
  </div>

  <!-- Last Name Field -->
  <div class="form-group">
    <label for="model">Model</label>
    <input type="text" id="model" formControlName="model" />
  </div>

  <!-- Department Field -->
  <div class="form-group">
    <label for="year">Year</label>
    <input type="text" id="Year" formControlName="Year" />
  </div>

  <!-- Is Admin Checkbox -->
  <div class="form-group">
    <label for="isFav">Is Fav</label>
    <input type="checkbox" id="isFav" formControlName="isFav" />
  </div>

  <!-- Submit Button (Add or Update) -->
  <button type="submit">Submit</button>

  <!-- Delete Button (Always Displayed Now) -->
  <button type="button" (click)="onDelete()">Delete</button>

  <!-- Back Button -->
  <button type="button" (click)="navigateToCarList()">Back to List</button>
</form>
